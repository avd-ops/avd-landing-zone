name: deploy

# Manual, environment-gated deployment. Configure required reviewers on the
# "prod" GitHub Environment so production changes need an approval.
#
# GITHUB FREE LIMIT: Environment required reviewers on a private repository
# require GitHub Pro, Team, or Enterprise. On a GitHub Free private repo,
# `environment:` will NOT pause for human approval — use interactive Cloud Shell
# (`./scripts/deploy/deploy.sh`) instead, and keep tenant-specific `.bicepparam`
# files under `config/` in your single private companion repo (`avd-private`).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (selects parameters/<env>.bicepparam and the GitHub Environment)
        type: choice
        options:
          - dev
          - prod
        default: dev
      whatIfOnly:
        description: Run what-if only
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AVD_USERS_GROUP_ID: ${{ secrets.AVD_USERS_GROUP_ID }}
      AVD_ADMINS_GROUP_ID: ${{ secrets.AVD_ADMINS_GROUP_ID }}
      AVD_SERVICE_PRINCIPAL_ID: ${{ secrets.AVD_SERVICE_PRINCIPAL_ID }}
      AVD_ALERT_EMAIL: ${{ secrets.AVD_ALERT_EMAIL }}
      AVD_MONTHLY_BUDGET: ${{ vars.AVD_MONTHLY_BUDGET }}
      # true only in the golden image build environment (docs/images.md); empty = no build subnets.
      AVD_IMAGE_BUILD_SUBNETS: ${{ vars.AVD_IMAGE_BUILD_SUBNETS }}
      AVD_LOCAL_ADMIN_PASSWORD: ${{ secrets.AVD_LOCAL_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: |
          args=(-p "parameters/${{ inputs.environment }}.bicepparam" -l "${{ vars.AZURE_LOCATION }}")
          if [[ "${{ inputs.whatIfOnly }}" == "true" ]]; then args+=(--what-if); fi
          ./scripts/deploy/deploy.sh "${args[@]}"
