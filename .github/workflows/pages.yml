name: pages

# Publishes site/ (the deployment portal, the region latency page and anything else on the
# website) to GitHub Pages. The site is kept apart from the code people deploy (README, "Repo
# layout"). Needs Settings > Pages > Source set to "GitHub Actions"; until then the last
# deployment stays up. Nothing here touches Azure.
on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
