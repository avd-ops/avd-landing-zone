name: pages

# Publishes site/ (the deployment portal, the region latency page and anything else on the
# website) to GitHub Pages. The site is kept apart from the code people deploy (README, "Repo
# layout"). Needs Settings > Pages > Source set to "GitHub Actions"; until then the last
# deployment stays up. The avd-ops site itself is published from nickprignano/avd-ops; the old
# pages here redirect to it. Nothing here touches Azure.
on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # The commit this portal is built from (decision 0017): the page compares it with the commit in
      # every pasted state line and says when the scripts are newer than the portal.
      # The latest release tag, when there is one, becomes the ref every command checks out (avd-ops
      # decision 0008); with no release yet the commands keep following master. After cutting a release,
      # run this workflow (gh workflow run pages.yml) so the portal picks the new tag up; a release
      # event would run on the tag, which the github-pages environment does not allow to deploy.
      - name: Record the build commit and release tag in portal-config.js
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Reading the latest release of $GITHUB_REPOSITORY"
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [[ $tag =~ ^v[0-9A-Za-z.-]+$ ]]; then ref=",\"ref\":\"$tag\""; echo "Commands check out $tag"; else ref=''; echo "No release yet: commands follow master"; fi
          printf '/* Written by the pages workflow (decision 0017). */\nwindow.AVDLZ_PORTAL_CONFIG = {"commit":"%s"%s};\n' "$GITHUB_SHA" "$ref" > site/portal/portal-config.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
