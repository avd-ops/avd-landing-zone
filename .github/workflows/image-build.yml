name: image-build

# Builds the month's golden image with Azure Image Builder (build/specs/image-pipeline-spec.md section 5,
# docs/images.md). A new version is excluded from "latest", and no landing zone uses it until a
# person promotes it, so a scheduled build needs no approval.
#
# Setup (docs/images.md): deploy bicep/images/main.bicep, then create the GitHub Environment
# "images" with the secrets AZURE_CLIENT_ID (the output buildIdentityClientId),
# AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID. Secrets, not variables: the repo is public, and Actions
# prints step inputs and env values, unmasked unless they are secrets. The identity is federated to
# that environment only.
on:
  schedule:
    # About a week after Patch Tuesday, on the third Monday. Cron combines a day-of-month
    # range and a day-of-week as OR, so this runs daily on days 15-21 and the job skips
    # every day but Monday.
    - cron: '0 6 15-21 * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the source image and the commit haven't changed (an out-of-band update)
        type: boolean
        default: false
      emergency:
        description: A security build (recorded on the version; spec section 5.7)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: image-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: images
    timeout-minutes: 480
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - name: Third Monday only (scheduled runs)
        id: gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "Not Monday; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Until the images environment has its Azure identity (Setup above), a scheduled run skips cleanly
      # instead of failing every third Monday with an issue nobody can act on (lesson 0039).
      - name: Images environment set up?
        id: setup
        if: steps.gate.outputs.skip != 'true'
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$TENANT_ID" ] && [ -n "$SUBSCRIPTION_ID" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Image build skipped: the images environment is not set up"
              echo
              echo "Deploy \`bicep/images/main.bicep\`, then give the GitHub Environment **images** the secrets"
              echo "\`AZURE_CLIENT_ID\` (the output buildIdentityClientId), \`AZURE_TENANT_ID\` and \`AZURE_SUBSCRIPTION_ID\`."
              echo "Steps: docs/images.md. Any open failure issue from an unconfigured run is closed."
            } >> "$GITHUB_STEP_SUMMARY"
            # A person who runs it by hand (force, emergency) must see it didn't build.
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::The images environment is not set up (docs/images.md); nothing was built."
              exit 1
            fi
            echo "Images environment not set up; skipping the build."
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.skip != 'true'
        with:
          persist-credentials: false

      - name: Install Bicep
        if: steps.setup.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/bicep" https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64
          chmod +x "$RUNNER_TEMP/bin/bicep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Azure login (OIDC, the images environment's identity)
        if: steps.setup.outputs.run == 'true'
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Build
        if: steps.setup.outputs.run == 'true'
        shell: pwsh
        env:
          FORCE: ${{ inputs.force }}
          EMERGENCY: ${{ inputs.emergency }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $p = @{
            Commit       = $env:GITHUB_SHA
            RunUrl       = $env:RUN_URL
            SummaryPath  = Join-Path $env:RUNNER_TEMP 'image-summary.json'
            LogDirectory = Join-Path $env:RUNNER_TEMP 'image-logs'
          }
          if ($env:FORCE -eq 'true') { $p.Force = $true }
          if ($env:EMERGENCY -eq 'true') { $p.Emergency = $true }
          ./scripts/ops/Start-AvdImageBuild.ps1 @p

      - name: Keep the customization logs
        if: always() && steps.setup.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-build-logs
          path: ${{ runner.temp }}/image-logs
          if-no-files-found: ignore
          retention-days: 90

      - name: Close failure issues while the images environment is not set up
        if: steps.setup.outputs.run == 'false'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { closeUnconfigured } = require(`${process.env.GITHUB_WORKSPACE}/scripts/ops/image-build-issue.cjs`);
            core.info(JSON.stringify(await closeUnconfigured({ github, context })));

      # One open failure issue at a time; a succeeded build closes it (scripts/ops/image-build-issue.cjs).
      - name: Open an issue with the result
        if: always() && steps.setup.outputs.run == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          SUMMARY: ${{ runner.temp }}/image-summary.json
        with:
          script: |
            const fs = require('fs');
            const { reportBuild } = require(`${process.env.GITHUB_WORKSPACE}/scripts/ops/image-build-issue.cjs`);
            const summary = fs.existsSync(process.env.SUMMARY) ? JSON.parse(fs.readFileSync(process.env.SUMMARY, 'utf8')) : null;
            core.info(JSON.stringify(await reportBuild({ github, context, core, summary })));
