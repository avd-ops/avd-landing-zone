name: secret-scan

# gitleaks over the full history on every PR and push to master. No path filter:
# a secret can land in a doc as easily as in a script. The local pre-commit hook
# (.githooks/pre-commit) is the first line; this is the backstop for a commit
# made without it. Known false positives are listed in .gitleaksignore.
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a shallow clone would quietly scan less

      # Pinned, so the ruleset can't change under a passing build.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # --redact keeps a real finding out of the public build log.
      - name: Scan full history
        run: gitleaks git --redact --verbose .
