name: secret-scan

# gitleaks over the full history on every PR and push to master. No path filter:
# a secret can land in a doc as easily as in a script. The local pre-commit hook
# (.githooks/pre-commit) is the first line; this is the backstop for a commit
# made without it. Known false positives are listed in .gitleaksignore.
# This runs the pinned gitleaks CLI, not gitleaks-action: the action scans the pushed
# commit range, which on a push that contains the root commit resolves to `<root>^`,
# an invalid revision, so it scanned nothing and still logged "no leaks found". It also
# needs extra permissions on PRs. The CLI over the full history has neither problem.
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a shallow clone would quietly scan less

      # Pinned, so the ruleset can't change under a passing build.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # --redact keeps a real finding out of the public build log.
      - name: Scan full history
        run: gitleaks git --redact --verbose .

      # .gitleaks.toml adds a rule for Azure subscription IDs. Prove it still fires on a planted one
      # (in each form it covers) and still passes the placeholders the tests use, so a broken pattern
      # can't pass the scan above by matching nothing.
      - name: Subscription ID rule catches a planted ID
        run: |
          set -euo pipefail
          t=$(mktemp -d)
          cp .gitleaks.toml "$t/"
          id=1f3c5e7a-9b2d-4c6e-8a0f-2b4d6f8a0c1e   # random, not a real subscription
          printf '%s\n' "/subscriptions/$id/resourceGroups/rg" "--subscription $id" "\"subscriptionId\": \"$id\"" "-SubscriptionId '$id'" > "$t/planted.txt"
          printf '%s\n' "/subscriptions/00000000-aaaa-bbbb-cccc-000000000001/resourceGroups/rg" > "$t/placeholder.txt"
          gitleaks dir --no-banner --report-format json --report-path "$t/report.json" "$t" || true
          found=$(jq '[.[] | select(.RuleID == "azure-subscription-id")] | length' "$t/report.json")
          placeholder=$(jq '[.[] | select(.File | endswith("placeholder.txt"))] | length' "$t/report.json")
          echo "planted: $found of 4 found; placeholder findings: $placeholder"
          [[ "$found" == 4 && "$placeholder" == 0 ]]

      # Local parameter overrides (parameters/*.local.bicepparam) hold tenant values and are gitignored;
      # this catches one added with git add -f.
      - name: No local parameter file is committed
        run: |
          if git ls-files 'parameters/*.local.bicepparam' | grep .; then
            echo "::error::A local parameter file is committed. Those hold tenant-specific values; keep them untracked."
            exit 1
          fi
