name: validate

# Static checks on every PR and on master; subscription what-if when enabled.
# Nothing here deploys.
on:
  pull_request:
    paths:
      - 'bicep/**'
      - 'parameters/**'
      - 'scripts/**'
      - 'tests/**'
      - '.claude/hooks/**'
      - '.githooks/**'
      - 'docs/portal/**'
      - 'PSScriptAnalyzerSettings.psd1'
      - 'bicepconfig.json'
      - 'ps-rule.yaml'
      - '.ps-rule/**'
      - '.github/workflows/validate.yml'
  push:
    branches:
      - master
    paths:
      - 'bicep/**'
      - 'parameters/**'
      - 'scripts/**'
      - 'tests/**'
      - '.claude/hooks/**'
      - '.githooks/**'
      - 'docs/portal/**'
      - 'PSScriptAnalyzerSettings.psd1'
      - 'bicepconfig.json'
      - 'ps-rule.yaml'
      - '.ps-rule/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

# Placeholder identity values so the .bicepparam files compile offline.
env:
  AVD_USERS_GROUP_ID: 00000000-0000-0000-0000-000000000001
  AVD_ADMINS_GROUP_ID: 00000000-0000-0000-0000-000000000002
  AVD_SERVICE_PRINCIPAL_ID: 00000000-0000-0000-0000-000000000003
  AVD_LOCAL_ADMIN_PASSWORD: Placeholder-only-for-build-1!

jobs:
  bicep:
    name: Bicep lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install && az bicep version

      # bicepconfig.json promotes the security-relevant linter rules to errors. Bicep exits 0
      # on warnings, and some compiler warnings (BCP245: a resource type that can't be
      # deployed, BCP037: a property ARM will reject) only show up at deploy time, so any
      # diagnostic at all fails the step. SARIF keeps az CLI's own notices out of the count.
      - name: Lint (warnings fail)
        run: |
          failed=0
          for f in bicep/main.bicep bicep/demo/main.bicep bicep/images/main.bicep bicep/images/build.bicep parameters/*.bicepparam; do
            results=$(az bicep lint --file "$f" --diagnostics-format sarif | jq -r '.runs[].results[] | "\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.level // "warning") \(.ruleId): \(.message.text)"')
            if [ -n "$results" ]; then echo "$f"; echo "$results"; failed=1; else echo "$f: clean"; fi
          done
          exit "$failed"

      - name: Build template and parameter files
        run: |
          az bicep build --file bicep/main.bicep --stdout > /dev/null
          az bicep build --file bicep/demo/main.bicep --stdout > /dev/null
          az bicep build --file bicep/images/main.bicep --stdout > /dev/null
          az bicep build --file bicep/images/build.bicep --stdout > /dev/null
          for f in parameters/*.bicepparam; do
            echo "build-params $f"
            az bicep build-params --file "$f" --stdout > /dev/null
          done

  scripts:
    name: Script analysis + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit

      # The offline scenarios and template guards compile the parameter files.
      - name: Install Bicep
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/bicep" https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x "$RUNNER_TEMP/bin/bicep"
          "$RUNNER_TEMP/bin/bicep" --version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Unit tests, offline end-to-end scenarios (tests/offline) and template guards.
      # Each one encodes a lesson from a real run: see docs/lessons.
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Invoke-Pester -Path ./tests -CI -Output Detailed

      - name: shellcheck (deploy script, session hook, pre-commit hook)
        run: shellcheck scripts/deploy/deploy.sh .claude/hooks/session-start.sh .githooks/pre-commit

  portal:
    name: Deployment portal tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The portal engine against real Cloud Shell output and the scripts' state lines,
      # plus a guard that its commands only use parameters the scripts define.
      - name: node --test
        run: node --test "tests/portal/*.test.mjs"

  psrule:
    name: PSRule for Azure (Well-Architected)
    runs-on: ubuntu-latest
    needs: bicep
    # A gate: every finding is either fixed or suppressed with a written
    # justification in .ps-rule/Suppressions.Rule.yaml.
    steps:
      - uses: actions/checkout@v4

      # Install the standalone Bicep CLI at a fixed path and point PSRule at it.
      # Relying on az/PATH discovery was intermittent and silently skipped a
      # whole parameter file.
      - name: Install Bicep
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bicep" https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x "$RUNNER_TEMP/bicep"
          "$RUNNER_TEMP/bicep" --version
          echo "PSRULE_AZURE_BICEP_PATH=$RUNNER_TEMP/bicep" >> "$GITHUB_ENV"

      - name: Analyze
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputPath: parameters/
          outputFormat: Markdown
          outputPath: reports/ps-rule.md
          summary: true

  what-if:
    name: Subscription what-if (dev)
    runs-on: ubuntu-latest
    needs: bicep
    # Opt-in: set repo variable AZURE_WHATIF_ENABLED=true. See docs/ci.md.
    if: ${{ vars.AZURE_WHATIF_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write
    env:
      AVD_USERS_GROUP_ID: ${{ vars.AVD_USERS_GROUP_ID }}
      AVD_ADMINS_GROUP_ID: ${{ vars.AVD_ADMINS_GROUP_ID }}
      AVD_SERVICE_PRINCIPAL_ID: ${{ vars.AVD_SERVICE_PRINCIPAL_ID }}
      AVD_LOCAL_ADMIN_PASSWORD: ${{ secrets.AVD_LOCAL_ADMIN_PASSWORD || 'WhatIf-placeholder-only-1!' }}
      AVD_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        run: |
          az deployment sub what-if \
            -n "avdlz-whatif-${GITHUB_RUN_ID}" \
            -l "${{ vars.AZURE_LOCATION }}" \
            -p parameters/dev.bicepparam
