name: validate

# Static checks on every PR and on master; subscription what-if when enabled.
# Nothing here deploys.
on:
  pull_request:
    paths:
      - 'bicep/**'
      - 'parameters/**'
      - 'scripts/**'
      - 'build/tests/**'
      - '.claude/hooks/**'
      - '.githooks/**'
      - 'site/**'
      - 'PSScriptAnalyzerSettings.psd1'
      - 'bicepconfig.json'
      - 'ps-rule.yaml'
      - '.ps-rule/**'
      - 'build/snapshot-diff.sh'
      - '.github/workflows/validate.yml'
  push:
    branches:
      - master
    paths:
      - 'bicep/**'
      - 'parameters/**'
      - 'scripts/**'
      - 'build/tests/**'
      - '.claude/hooks/**'
      - '.githooks/**'
      - 'site/**'
      - 'PSScriptAnalyzerSettings.psd1'
      - 'bicepconfig.json'
      - 'ps-rule.yaml'
      - '.ps-rule/**'
      - 'build/snapshot-diff.sh'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

# Placeholder identity values so the .bicepparam files compile offline.
env:
  AVD_USERS_GROUP_ID: 00000000-0000-0000-0000-000000000001
  AVD_ADMINS_GROUP_ID: 00000000-0000-0000-0000-000000000002
  AVD_SERVICE_PRINCIPAL_ID: 00000000-0000-0000-0000-000000000003
  AVD_LOCAL_ADMIN_PASSWORD: Placeholder-only-for-build-1!
  # Tool versions, pinned so a new release can't change a result without a PR. A bump is a
  # PR that runs every job on the new version. Template.Tests.ps1 checks the session hook and
  # the live PSRule review (AvdLandingZone.psm1) use the same versions.
  BICEP_VERSION: v0.48.1
  PSRULE_VERSION: 2.9.0
  PSRULE_AZURE_VERSION: 1.47.0
  PSSCRIPTANALYZER_VERSION: 1.25.0
  PESTER_VERSION: 6.2.0

jobs:
  bicep:
    name: Bicep lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Bicep
        run: az bicep install --version "$BICEP_VERSION" && az bicep version

      # bicepconfig.json promotes the security-relevant linter rules to errors. Bicep exits 0
      # on warnings, and some compiler warnings (BCP245: a resource type that can't be
      # deployed, BCP037: a property ARM will reject) only show up at deploy time, so any
      # diagnostic at all fails the step. SARIF keeps az CLI's own notices out of the count.
      - name: Lint (warnings fail)
        shell: bash # -eo pipefail: a lint that fails with no output must fail the step, not read as clean
        run: |
          failed=0
          for f in bicep/main.bicep bicep/demo/main.bicep bicep/images/main.bicep bicep/images/build.bicep bicep/recorder/main.bicep bicep/portal/main.bicep parameters/*.bicepparam; do
            results=$(az bicep lint --file "$f" --diagnostics-format sarif | jq -r '.runs[].results[] | "\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.level // "warning") \(.ruleId): \(.message.text)"')
            if [ -n "$results" ]; then echo "$f"; echo "$results"; failed=1; else echo "$f: clean"; fi
          done
          exit "$failed"

      - name: Build template and parameter files
        run: |
          az bicep build --file bicep/main.bicep --stdout > /dev/null
          az bicep build --file bicep/demo/main.bicep --stdout > /dev/null
          az bicep build --file bicep/images/main.bicep --stdout > /dev/null
          az bicep build --file bicep/images/build.bicep --stdout > /dev/null
          az bicep build --file bicep/recorder/main.bicep --stdout > /dev/null
          az bicep build --file bicep/portal/main.bicep --stdout > /dev/null
          for f in parameters/*.bicepparam; do
            echo "build-params $f"
            az bicep build-params --file "$f" --stdout > /dev/null
          done

  scripts:
    name: Script analysis + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION
          Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit

      # The offline scenarios and template guards compile the parameter files.
      - name: Install Bicep
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/bicep" "https://github.com/Azure/bicep/releases/download/$BICEP_VERSION/bicep-linux-x64"
          chmod +x "$RUNNER_TEMP/bin/bicep"
          "$RUNNER_TEMP/bin/bicep" --version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Unit tests, offline end-to-end scenarios (build/tests/offline) and template guards.
      # Each one encodes a lesson from a real run: see build/lessons.
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          Invoke-Pester -Path ./build/tests -CI -Output Detailed

      - name: shellcheck (deploy script, session hook, pre-commit hook)
        run: shellcheck scripts/deploy/deploy.sh .claude/hooks/session-start.sh .githooks/pre-commit build/snapshot-diff.sh

  portal:
    name: Deployment portal tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # The portal engine against real Cloud Shell output and the scripts' state lines,
      # plus a guard that its commands only use parameters the scripts define.
      - name: node --test
        run: node --test "build/tests/portal/*.test.mjs"

  psrule:
    name: PSRule for Azure (Well-Architected)
    runs-on: ubuntu-latest
    needs: bicep
    # A gate: every finding is either fixed or suppressed with a written
    # justification in .ps-rule/Suppressions.Rule.yaml.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Install the standalone Bicep CLI at a fixed path and point PSRule at it.
      # Relying on az/PATH discovery was intermittent and silently skipped a
      # whole parameter file.
      - name: Install Bicep
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bicep" "https://github.com/Azure/bicep/releases/download/$BICEP_VERSION/bicep-linux-x64"
          chmod +x "$RUNNER_TEMP/bicep"
          "$RUNNER_TEMP/bicep" --version
          echo "PSRULE_AZURE_BICEP_PATH=$RUNNER_TEMP/bicep" >> "$GITHUB_ENV"

      # Pinned modules installed here, not by the ps-rule action (which takes the latest rules
      # module), so CI and the live -WellArchitected review run the same rules. ps-rule.yaml
      # limits input to the parameter files and .ps-rule/ holds the suppressions.
      - name: Analyze
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSRule -RequiredVersion $env:PSRULE_VERSION -Scope CurrentUser -Force
          Install-Module PSRule.Rules.Azure -RequiredVersion $env:PSRULE_AZURE_VERSION -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module PSRule -RequiredVersion $env:PSRULE_VERSION
          Import-Module PSRule.Rules.Azure -RequiredVersion $env:PSRULE_AZURE_VERSION
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          try {
            Assert-PSRule -Format File -InputPath . -Module PSRule.Rules.Azure -OutputFormat Markdown -OutputPath reports/ps-rule.md -ErrorAction Stop
          }
          finally {
            if (Test-Path reports/ps-rule.md) { Get-Content reports/ps-rule.md | Add-Content $env:GITHUB_STEP_SUMMARY }
          }

  snapshot:
    name: Offline what-if (bicep snapshot)
    runs-on: ubuntu-latest
    needs: bicep
    # The resources each parameter file would deploy, compared with the base branch, in the
    # job summary. No Azure sign-in. Advisory: a difference is information, not a failure.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Bicep
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/bicep" "https://github.com/Azure/bicep/releases/download/$BICEP_VERSION/bicep-linux-x64"
          chmod +x "$RUNNER_TEMP/bin/bicep"
          "$RUNNER_TEMP/bin/bicep" --version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Compare with base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then base=HEAD~1; fi
          build/snapshot-diff.sh "$base" "$GITHUB_STEP_SUMMARY"

  what-if:
    name: Subscription what-if (dev)
    runs-on: ubuntu-latest
    needs: bicep
    # Opt-in: set repo variable AZURE_WHATIF_ENABLED=true. See docs/ci.md.
    if: ${{ vars.AZURE_WHATIF_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write
    env:
      AVD_USERS_GROUP_ID: ${{ vars.AVD_USERS_GROUP_ID }}
      AVD_ADMINS_GROUP_ID: ${{ vars.AVD_ADMINS_GROUP_ID }}
      AVD_SERVICE_PRINCIPAL_ID: ${{ vars.AVD_SERVICE_PRINCIPAL_ID }}
      AVD_LOCAL_ADMIN_PASSWORD: ${{ secrets.AVD_LOCAL_ADMIN_PASSWORD || 'WhatIf-placeholder-only-1!' }}
      AVD_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Azure login (OIDC)
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        run: |
          az deployment sub what-if \
            -n "avdlz-whatif-${GITHUB_RUN_ID}" \
            -l "${{ vars.AZURE_LOCATION }}" \
            -p parameters/dev.bicepparam
